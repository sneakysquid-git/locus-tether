# Run from the repo root with a `.env` file present (copy docker/.env.example
# to `.env` and adjust OMI_DATA_DIR first):
#   docker compose --env-file .env -f docker/docker-compose.yml up -d --build
#
# The --env-file flag is NOT optional cosmetics: Compose looks for .env
# relative to THIS FILE's own directory by default, not wherever you run the
# command from. Since .env lives at repo root (one level up), omitting this
# flag means OMI_DATA_DIR silently resolves to blank and every bind mount
# below ends up rooted at the filesystem root instead of your real data
# directory — with no error, just an easy-to-miss WARN line and a container
# that still reports "Up".
#
# The volumes below read ${OMI_DATA_DIR} from that .env file — it should
# point at a DATA directory kept separate from this code repo (e.g.
# /home/<your-username>/omi-data). See README's "Directory layout on the Thor".
#
# Prerequisites on the Thor host before this will actually use the GPU:
#   1. NVIDIA container runtime installed and set as the default runtime
#      (usually already true on JetPack images, but confirm:
#      `cat /etc/docker/daemon.json` should show "default-runtime": "nvidia").
#   2. The inbox/processing/archive/transcripts/failed directories referenced
#      below should already exist on the host, or Docker will create them
#      as root-owned, which is fine for a single-user box but worth knowing.
#
# ON MPS: this originally used CUDA MPS to cap GPU usage for this container,
# leaving headroom for robotics work (see the GPU-partitioning discussion
# early in this project). MPS was DISABLED after confirming, on real
# hardware, that it causes Ollama's llama-server subprocess to hang
# indefinitely during GPU discovery ("llama-server GPU discovery watchdog
# timed out", repeating on every load attempt) — a real bug in how MPS
# interacts with Thor's still-maturing driver stack, not a config mistake on
# our end. Given this pipeline's actual GPU usage is bursty and brief
# (Whisper + Ollama each run for seconds, not continuously), default CUDA
# time-slicing without MPS is the right tradeoff here — contention with
# robotics work should be rare and brief even without a hard cap. Revisit if
# NVIDIA/Ollama ship a fix for this on a future JetPack release.

services:
  omi-pipeline:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: omi-pipeline
    restart: unless-stopped
    runtime: nvidia
    # Ollama runs natively on the Thor host, not in a container (its own GPU
    # backend selection needed a systemd-level env var fix that's simplest
    # to apply on the host directly — see README). network_mode: host lets
    # this container reach it via plain "localhost:11434" rather than
    # needing extra_hosts/host.docker.internal plumbing — reasonable on a
    # single-device box like this where the container doesn't need network
    # isolation from its own host anyway.
    network_mode: host
    environment:
      # --- Required for the NVIDIA container runtime hook to actually inject
      # GPU devices — confirmed by testing on this exact hardware that
      # `runtime: nvidia` alone was NOT sufficient; without these two vars
      # explicitly set, the hook injects nothing at all (no /dev/nvidia*
      # nodes show up in the container, even though the host has them and
      # the CSV mount-spec files are correctly configured). Thor doesn't
      # support the more common `--gpus=all` shorthand, which normally sets
      # these implicitly — so on this hardware they must be set by hand.
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all

      # --- Pipeline config (see config.py for the full list) ---
      # Must match the /app/... mount points below, since config.py derives
      # inbox/processing/archive/transcripts/failed as subdirs of this.
      OMI_PIPELINE_BASE: /app
      OMI_WHISPER_MODEL: large-v3
      OMI_WHISPER_DEVICE: cuda
      OMI_WHISPER_COMPUTE_TYPE: float16
    volumes:
      # Pipeline DATA directories on the host — ${OMI_DATA_DIR} here comes
      # from your .env file (see docker/.env.example) and should point at a
      # directory separate from this code repo, e.g. /home/<your-username>/omi-data.
      # (Deliberately a different variable name than OMI_PIPELINE_BASE above —
      # that one is the in-container path, this one is the host path, and
      # they should NOT be the same string or this gets confusing fast.)
      - ${OMI_DATA_DIR}/inbox:/app/inbox
      - ${OMI_DATA_DIR}/processing:/app/processing
      - ${OMI_DATA_DIR}/archive:/app/archive
      - ${OMI_DATA_DIR}/transcripts:/app/transcripts
      - ${OMI_DATA_DIR}/failed:/app/failed

      # Cache the Whisper model download across container restarts/rebuilds.
      - whisper-model-cache:/root/.cache/huggingface

volumes:
  whisper-model-cache:
