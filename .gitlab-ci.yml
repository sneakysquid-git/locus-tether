# .gitlab-ci.yml
#
# Deliberately trimmed from a earlier, more comprehensive version. That
# version included pylint, mypy, GitLab's SAST template, a custom grep-
# based code-review job, IaC-SAST, and container scanning — reasonable
# defaults for a larger team project, but mismatched for this one:
#   - pylint/mypy substantially overlapped with flake8 and were already
#     allow_failure: true (never blocked anything)
#   - SAST and the custom grep job substantially overlapped with the
#     flake8-bandit checks already running as part of the flake8 job
#   - IaC-SAST has minimal real surface here (a docker-compose file and a
#     couple of systemd units, not Terraform/K8s manifests)
#   - container scanning scans an image pushed to a registry, but nobody
#     pulls a prebuilt image from this project — everyone self-hosting it
#     builds the Dockerfile themselves, on their own hardware
# What's left is scoped to this project's actual risk profile: real lint
# findings, real regression tests, and the three checks whose failure
# mode (a leaked credential, a known-vulnerable dependency, a license
# conflict) is serious enough to justify automated coverage regardless of
# project size.

stages:
  - lint
  - test
  - security

variables:
  PYTHON_VERSION: "3.11"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# ─── Cache ────────────────────────────────────────────────────────────────────
.python-cache: &python-cache
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/pip
      - venv/

# ─── Lint ─────────────────────────────────────────────────────────────────────
# Config lives in .flake8 (per-file-ignores for deliberate patterns: the
# sys.path-before-import files, prompts.py/webapp.py's naturally-long
# lines, and S101 for tests/ — assert is how pytest tests are written,
# not a security concern there). CLI flags kept here too so the command
# is self-explanatory without needing to open the config file.
flake8:
  stage: lint
  image: python:$PYTHON_VERSION-slim
  <<: *python-cache
  before_script:
    - pip install flake8 flake8-bugbear flake8-bandit
  script:
    - flake8 . --max-line-length=120 --exclude=venv,.git
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ─── Tests ────────────────────────────────────────────────────────────────────
pytest:
  stage: test
  image: python:$PYTHON_VERSION-slim
  <<: *python-cache
  before_script:
    - pip install pytest pytest-cov -r requirements.txt
  script:
    - pytest --cov=. --cov-report=xml --cov-report=term-missing -v
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ─── Build sanity check: deliberately NOT included ───────────────────────────
# The Dockerfile installs CUDA/cuDNN from NVIDIA's Jetson-specific (L4T)
# apt repository — packages that only exist for the Jetson's ARM64
# architecture. Standard GitLab CI runners (shared runners, and most
# self-hosted ones by default) run on x86_64, where those exact package
# names simply aren't in that repo's index. This isn't a version mismatch
# or something to patch — this Dockerfile can only successfully build on
# actual Jetson/ARM64 hardware, never in typical CI infrastructure. A
# build job here would be permanently red, not a real check of anything.
# If an actual ARM64/Jetson-based runner is ever registered for this
# project, this would be worth revisiting with a job scoped to that
# runner specifically via `tags:`.

# ─── Security scanning ────────────────────────────────────────────────────────
include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.v2.gitlab-ci.yml

secret_detection:
  stage: security

# The v2 template's job is named "dependency-scanning" (hyphen) — the
# original "dependency_scanning" (underscore) override never matched it,
# silently creating a separate, empty job with no script that failed
# outright instead of actually configuring the real one.
dependency-scanning:
  stage: security

license_scanning:
  stage: security
  image: python:$PYTHON_VERSION-slim
  before_script:
    - pip install pip-licenses
  script:
    - pip install -r requirements.txt -r docker/requirements-docker.txt
    # NOTE: "table" is not a valid --format value in current pip-licenses
    # releases (removed/renamed in a past major version bump) — this
    # failed outright before being caught. "plain" is the closest
    # equivalent: a simple, readable text table.
    - pip-licenses --format=json --output-file=licenses.json
    - pip-licenses --format=plain
  artifacts:
    paths:
      - licenses.json
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
