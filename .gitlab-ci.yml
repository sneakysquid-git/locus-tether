# .gitlab-ci.yml
# Full CI pipeline: code review, security scanning, secret detection

stages:
  - lint
  - test
  - build
  - security
  - review

variables:
  PYTHON_VERSION: "3.11"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  # Container scanning — point to the image built in the build stage
  CS_IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"

# ─── Cache ────────────────────────────────────────────────────────────────────
.python-cache: &python-cache
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/pip
      - venv/

# ─── Lint / Code Review ───────────────────────────────────────────────────────
flake8:
  stage: lint
  image: python:$PYTHON_VERSION-slim
  <<: *python-cache
  before_script:
    - pip install flake8 flake8-bugbear flake8-bandit
  script:
    - flake8 . --max-line-length=120 --exclude=venv,.git
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

pylint:
  stage: lint
  image: python:$PYTHON_VERSION-slim
  <<: *python-cache
  before_script:
    - pip install pylint -r requirements.txt
  script:
    - pylint **/*.py --fail-under=7.0 --disable=C0114,C0115,C0116 || true
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

mypy:
  stage: lint
  image: python:$PYTHON_VERSION-slim
  <<: *python-cache
  before_script:
    - pip install mypy -r requirements.txt
  script:
    - mypy . --ignore-missing-imports --exclude venv
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ─── Unit Tests ───────────────────────────────────────────────────────────────
pytest:
  stage: test
  image: python:$PYTHON_VERSION-slim
  <<: *python-cache
  before_script:
    - pip install pytest pytest-cov -r requirements.txt
  script:
    - pytest --cov=. --cov-report=xml --cov-report=term-missing -v
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ─── Build Docker Image ───────────────────────────────────────────────────────
build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -t "$CS_IMAGE" -f docker/Dockerfile .
    - docker push "$CS_IMAGE"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ─── Security Scanning (GitLab Ultimate templates) ────────────────────────────

# Static Application Security Testing (SAST)
include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.v2.gitlab-ci.yml
  - template: Jobs/Container-Scanning.gitlab-ci.yml
  - template: Jobs/SAST-IaC.gitlab-ci.yml

# Override SAST to run in the security stage
sast:
  stage: security

secret_detection:
  stage: security

dependency_scanning:
  stage: security

container_scanning:
  stage: security
  variables:
    CS_IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  needs:
    - build

iac-sast:
  stage: security

# ─── AI-Assisted Code Review (MR only) ───────────────────────────────────────
code_review:
  stage: review
  image: python:$PYTHON_VERSION-slim
  before_script:
    - pip install requests
  script:
    - |
      echo "Running diff-based code review checks..."
      # Fail on common Python anti-patterns using grep
      git diff origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME...HEAD -- '*.py' | \
        grep -E "^\+" | \
        grep -vE "^\+\+" | \
        grep -E "(eval\(|exec\(|__import__\(|pickle\.loads|subprocess\.call\(shell=True)" && \
        echo "WARNING: Potentially dangerous patterns detected in diff" || \
        echo "No dangerous patterns found."
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ─── License Compliance ───────────────────────────────────────────────────────
license_scanning:
  stage: security
  image: python:$PYTHON_VERSION-slim
  before_script:
    - pip install pip-licenses
  script:
    - pip install -r requirements.txt -r docker/requirements-docker.txt
    - pip-licenses --format=json --output-file=licenses.json
    - pip-licenses --format=table
  artifacts:
    paths:
      - licenses.json
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

